<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ARKADE</title>
<style>
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  background: #0d1426;
  overflow: hidden;
}
canvas {
  display: block;
  margin: 0 auto;
  background: #16213b;
  -webkit-tap-highlight-color: rgba(0, 0, 0, 0);
  -webkit-user-select: none;
  -webkit-touch-callout: none;
}
</style>
</head>
<body>
<canvas id="game" width="960" height="544"></canvas>
<noscript><p style="color:#f4ecd8;font-family:Arial;text-align:center;padding-top:200px">Turn on JavaScript in the browser settings.</p></noscript>
<script>
/*
  ARKADE engine
  Written in plain ES5 on purpose: the PS Vita browser is an old WebKit.
  No let/const, arrow functions, classes, template strings, Math.hypot, etc.
  Everything draws into one 960x544 canvas (the Vita's native screen).
*/
(function () {
  var W = 960, H = 544;
  var ARK = window.ARK = { W: W, H: H, scenes: {}, scene: null, sceneName: '', dirty: true, time: 0 };

  ARK.C = {
    bg: '#16213b',
    bg2: '#1f2d4d',
    ink: '#0d1426',
    cream: '#f4ecd8',
    dim: 'rgba(244,236,216,0.55)',
    mustard: '#f2b134',
    coral: '#e8604c',
    mint: '#5fbfa0',
    sky: '#7fb7e0',
    lilac: '#b79be8',
    felt: '#1f7a5c'
  };
  ARK.FONT = 'Arial, Helvetica, sans-serif';

  var canvas, ctx, last = 0, touchActive = false;
  var raf = window.requestAnimationFrame || window.webkitRequestAnimationFrame ||
    function (cb) { return window.setTimeout(cb, 16); };

  ARK.isVita = /PlayStation Vita/i.test(navigator.userAgent || '');
  ARK.pointer = { down: false, x: 0, y: 0 };

  /* ---------- scenes ---------- */
  ARK.register = function (name, scene) { ARK.scenes[name] = scene; };
  ARK.go = function (name, arg) {
    if (ARK.scene && ARK.scene.exit) ARK.scene.exit();
    ARK.scene = ARK.scenes[name];
    ARK.sceneName = name;
    ARK.pointer.down = false;
    if (ARK.scene.enter) ARK.scene.enter(arg);
    ARK.dirty = true;
  };

  /* ---------- math helpers ---------- */
  ARK.clamp = function (v, a, b) { return v < a ? a : (v > b ? b : v); };
  ARK.rand = function (a, b) { return a + Math.random() * (b - a); };
  ARK.randInt = function (n) { return Math.floor(Math.random() * n); };
  ARK.dist = function (x1, y1, x2, y2) { var dx = x2 - x1, dy = y2 - y1; return Math.sqrt(dx * dx + dy * dy); };
  ARK.gauss = function () { var u = 1 - Math.random(), v = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
  ARK.range = function (n) { var a = []; for (var i = 0; i < n; i++) a.push(i); return a; };
  ARK.shuffle = function (a) {
    for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  };
  ARK.fmtTime = function (s) {
    s = Math.floor(s);
    var m = Math.floor(s / 60), r = s % 60;
    return m + ':' + (r < 10 ? '0' : '') + r;
  };

  /* ---------- save data (localStorage can be missing or throw) ---------- */
  ARK.load = function (k, d) {
    try { var v = window.localStorage.getItem('ark_' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; }
  };
  ARK.save = function (k, v) {
    try { window.localStorage.setItem('ark_' + k, JSON.stringify(v)); } catch (e) { }
  };

  /* ---------- drawing helpers ---------- */
  ARK.path = function (x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  };
  ARK.rr = function (x, y, w, h, r, fill, stroke, lw) {
    ARK.path(x, y, w, h, r);
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw || 2; ctx.stroke(); }
  };
  ARK.circle = function (x, y, r, fill, stroke, lw) {
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2, false);
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw || 2; ctx.stroke(); }
  };
  ARK.line = function (x1, y1, x2, y2, color, lw) {
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
    ctx.strokeStyle = color; ctx.lineWidth = lw || 2; ctx.stroke();
  };
  ARK.text = function (s, x, y, size, color, align, weight) {
    ctx.font = (weight || 'bold') + ' ' + size + 'px ' + ARK.FONT;
    ctx.fillStyle = color || ARK.C.cream;
    ctx.textAlign = align || 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText(s, x, y);
  };
  ARK.wrap = function (s, x, y, maxW, size, color, lh, weight) {
    ctx.font = (weight || 'normal') + ' ' + size + 'px ' + ARK.FONT;
    var words = s.split(' '), lineStr = '', yy = y;
    for (var i = 0; i < words.length; i++) {
      var test = lineStr ? lineStr + ' ' + words[i] : words[i];
      if (ctx.measureText(test).width > maxW && lineStr) {
        ARK.text(lineStr, x, yy, size, color, 'left', weight || 'normal');
        lineStr = words[i]; yy += lh;
      } else lineStr = test;
    }
    if (lineStr) ARK.text(lineStr, x, yy, size, color, 'left', weight || 'normal');
    return yy + lh;
  };
  ARK.bg = function (color) { ctx.fillStyle = color || ARK.C.bg; ctx.fillRect(0, 0, W, H); };
  ARK.hit = function (b, x, y) { return b && x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h; };
  ARK.btn = function (b, label, fill, color, size, off) {
    ARK.rr(b.x, b.y + 4, b.w, b.h, 12, 'rgba(0,0,0,0.35)');
    ARK.rr(b.x, b.y, b.w, b.h, 12, off ? '#3a4766' : (fill || ARK.C.mustard));
    ARK.text(label, b.x + b.w / 2, b.y + b.h / 2 + 1, size || 20, off ? 'rgba(244,236,216,0.35)' : (color || ARK.C.ink), 'center');
  };
  ARK.BACK = { x: 14, y: 12, w: 92, h: 38 };
  ARK.backBtn = function () { ARK.btn(ARK.BACK, 'MENU', ARK.C.cream, ARK.C.ink, 16); };

  /* dark overlay card for win / lose screens. returns nothing, games hit-test their own buttons */
  ARK.overlay = function (title, sub, color) {
    ctx.fillStyle = 'rgba(13,20,38,0.78)';
    ctx.fillRect(0, 0, W, H);
    ARK.rr(230, 130, 500, 280, 22, ARK.C.cream);
    ARK.rr(230, 130, 500, 70, 22, color || ARK.C.mustard);
    ctx.fillStyle = ARK.C.cream; ctx.fillRect(230, 180, 500, 22);
    ARK.text(title, 480, 168, 36, ARK.C.ink, 'center');
    if (sub) {
      var lines = sub.split('\n');
      for (var i = 0; i < lines.length; i++) ARK.text(lines[i], 480, 240 + i * 30, 22, ARK.C.ink, 'center', i === 0 ? 'bold' : 'normal');
    }
  };
  ARK.OV_A = { x: 260, y: 330, w: 210, h: 54 };
  ARK.OV_B = { x: 490, y: 330, w: 210, h: 54 };

  /* the house mascot, used by Meowdoku and the menu */
  ARK.cat = function (x, y, s, color, eyes) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(x - s * 0.78, y - s * 0.2); ctx.lineTo(x - s * 0.62, y - s * 0.95); ctx.lineTo(x - s * 0.18, y - s * 0.62);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(x + s * 0.78, y - s * 0.2); ctx.lineTo(x + s * 0.62, y - s * 0.95); ctx.lineTo(x + s * 0.18, y - s * 0.62);
    ctx.closePath(); ctx.fill();
    ARK.circle(x, y, s * 0.72, color);
    var e = eyes || ARK.C.cream;
    ARK.circle(x - s * 0.28, y - s * 0.06, s * 0.13, e);
    ARK.circle(x + s * 0.28, y - s * 0.06, s * 0.13, e);
    ARK.circle(x, y + s * 0.18, s * 0.07, ARK.C.coral);
    ctx.strokeStyle = e; ctx.lineWidth = Math.max(1, s * 0.05);
    ctx.beginPath();
    ctx.moveTo(x - s * 0.2, y + s * 0.3); ctx.lineTo(x - s * 0.62, y + s * 0.22);
    ctx.moveTo(x - s * 0.2, y + s * 0.36); ctx.lineTo(x - s * 0.6, y + s * 0.42);
    ctx.moveTo(x + s * 0.2, y + s * 0.3); ctx.lineTo(x + s * 0.62, y + s * 0.22);
    ctx.moveTo(x + s * 0.2, y + s * 0.36); ctx.lineTo(x + s * 0.6, y + s * 0.42);
    ctx.stroke();
  };

  /* offscreen canvas for things that never change (boards, tables) */
  ARK.buffer = function (w, h, paint) {
    var c = document.createElement('canvas');
    c.width = w; c.height = h;
    var real = ctx;
    ctx = c.getContext('2d');
    ARK.ctx = ctx;
    paint(ctx);
    ctx = real;
    ARK.ctx = ctx;
    return c;
  };

  /* ---------- input ---------- */
  function pos(e) {
    var r = canvas.getBoundingClientRect();
    var p = e;
    if (e.changedTouches && e.changedTouches.length) p = e.changedTouches[0];
    return { x: (p.clientX - r.left) * W / r.width, y: (p.clientY - r.top) * H / r.height };
  }
  function down(e) {
    var p = pos(e);
    ARK.pointer.down = true; ARK.pointer.x = p.x; ARK.pointer.y = p.y;
    if (ARK.scene && ARK.scene.down) ARK.scene.down(p.x, p.y);
    ARK.dirty = true;
  }
  function move(e) {
    if (!ARK.pointer.down) return;
    var p = pos(e);
    ARK.pointer.x = p.x; ARK.pointer.y = p.y;
    if (ARK.scene && ARK.scene.move) ARK.scene.move(p.x, p.y);
    ARK.dirty = true;
  }
  function up(e) {
    if (!ARK.pointer.down) return;
    var p = pos(e);
    ARK.pointer.down = false;
    if (ARK.scene && ARK.scene.up) ARK.scene.up(p.x, p.y);
    ARK.dirty = true;
  }

  function resize() {
    var ww = window.innerWidth || W, wh = window.innerHeight || H;
    var s = Math.min(ww / W, wh / H);
    canvas.style.width = Math.floor(W * s) + 'px';
    canvas.style.height = Math.floor(H * s) + 'px';
    canvas.style.marginTop = Math.max(0, Math.floor((wh - H * s) / 2)) + 'px';
    ARK.dirty = true;
  }

  /* ---------- loop ---------- */
  function frame() {
    var now = Date.now();
    var dt = last ? (now - last) / 1000 : 0.016;
    last = now;
    if (dt > 0.05) dt = 0.05;
    if (dt <= 0) dt = 0.001;
    ARK.time += dt;
    var s = ARK.scene;
    if (s) {
      if (s.update) s.update(dt);
      if (ARK.dirty || s.live) { s.draw(ctx); ARK.dirty = false; }
    }
    raf(frame);
  }

  ARK.start = function () {
    canvas = document.getElementById('game');
    ctx = canvas.getContext('2d');
    ARK.ctx = ctx;
    ARK.canvas = canvas;
    resize();
    window.addEventListener('resize', resize, false);
    canvas.addEventListener('touchstart', function (e) { e.preventDefault(); touchActive = true; down(e); }, false);
    canvas.addEventListener('touchmove', function (e) { e.preventDefault(); move(e); }, false);
    canvas.addEventListener('touchend', function (e) { e.preventDefault(); up(e); }, false);
    canvas.addEventListener('touchcancel', function (e) { e.preventDefault(); up(e); }, false);
    canvas.addEventListener('mousedown', function (e) { if (!touchActive) down(e); }, false);
    window.addEventListener('mousemove', function (e) { if (!touchActive) move(e); }, false);
    window.addEventListener('mouseup', function (e) { if (!touchActive) up(e); }, false);
    document.addEventListener('touchmove', function (e) { e.preventDefault(); }, false);
    ARK.go(ARK.isVita || ARK.load('skipGate', false) ? 'menu' : 'gate');
    raf(frame);
  };
})();

</script>
<script>
/* ARKADE: gate screen (non-Vita warning) + main menu */
(function () {
  var A = ARK, C = A.C;

  /* ---------------- gate ---------------- */
  var GO = { x: 330, y: 340, w: 300, h: 60 };
  A.register('gate', {
    draw: function (ctx) {
      A.bg();
      A.cat(480, 150, 70, C.mustard, C.ink);
      A.text('ARKADE IS BUILT FOR THE PS VITA', 480, 250, 30, C.cream, 'center');
      A.text('This browser is not a Vita. Touch still works, it just might feel off.', 480, 290, 18, C.dim, 'center', 'normal');
      A.btn(GO, 'PLAY ANYWAY', C.mustard, C.ink, 22);
    },
    up: function (x, y) {
      if (A.hit(GO, x, y)) { A.save('skipGate', true); A.go('menu'); }
    }
  });

  /* ---------------- menu ---------------- */
  var GAMES = [
    { id: 'meowdoku', name: 'MEOWDOKU', tag: 'cat logic', color: C.mustard,
      best: function () { var b = A.load('meow_best_6', 0); return b ? '6x6 BEST ' + A.fmtTime(b) : 'no clears yet'; } },
    { id: 'pool', name: 'POOL', tag: '8-ball', color: C.mint,
      best: function () { return A.load('pool_wins', 0) + ' WINS VS CPU'; } },
    { id: 'golf', name: 'GOLF', tag: '9 holes', color: C.sky,
      best: function () { var b = A.load('golf_best', 0); return b ? 'BEST ' + b + ' STROKES' : 'no rounds yet'; } },
    { id: 'darts', name: 'DARTS', tag: '301 + count up', color: C.coral,
      best: function () { var b = A.load('darts_best', 0); return b ? 'BEST ' + b : 'no games yet'; } },
    { id: 'whodis', name: 'WHO DIS?', tag: 'read the room', color: C.lilac,
      best: function () { return A.load('who_wins', 0) + ' WINS VS BOT'; } }
  ];
  var TW = 168, TH = 262, GAP = 16, TX = 28, TY = 190;
  var pressed = -1, bgBuf = null;

  function tileRect(i) { return { x: TX + i * (TW + GAP), y: TY, w: TW, h: TH }; }

  function icon(id, cx, cy) {
    var ctx = A.ctx;
    if (id === 'meowdoku') {
      A.cat(cx, cy + 6, 40, C.ink, C.mustard);
    } else if (id === 'pool') {
      A.circle(cx + 4, cy + 6, 40, 'rgba(0,0,0,0.25)');
      A.circle(cx, cy, 40, '#111');
      A.circle(cx - 6, cy - 6, 17, C.cream);
      A.text('8', cx - 6, cy - 5, 22, '#111', 'center');
    } else if (id === 'golf') {
      ctx.save(); ctx.translate(cx, cy + 34); ctx.scale(1, 0.27); A.circle(0, 0, 34, C.ink); ctx.restore();
      A.line(cx, cy + 34, cx, cy - 40, C.ink, 4);
      ctx.fillStyle = C.coral; ctx.beginPath(); ctx.moveTo(cx, cy - 40); ctx.lineTo(cx + 34, cy - 28); ctx.lineTo(cx, cy - 16); ctx.closePath(); ctx.fill();
      A.circle(cx - 18, cy + 28, 7, C.cream);
    } else if (id === 'darts') {
      A.circle(cx, cy, 42, C.ink);
      A.circle(cx, cy, 30, C.cream);
      A.circle(cx, cy, 18, C.ink);
      A.circle(cx, cy, 7, C.cream);
      A.line(cx + 4, cy - 4, cx + 36, cy - 36, C.cream, 4);
      ctx.fillStyle = C.mustard; ctx.beginPath(); ctx.moveTo(cx + 30, cy - 42); ctx.lineTo(cx + 46, cy - 46); ctx.lineTo(cx + 42, cy - 30); ctx.closePath(); ctx.fill();
    } else if (id === 'whodis') {
      A.rr(cx - 34, cy - 44, 68, 88, 10, C.cream);
      A.circle(cx, cy - 4, 22, C.ink);
      A.text('?', cx, cy - 2, 30, C.lilac, 'center');
      A.rr(cx - 22, cy + 24, 44, 12, 6, C.ink);
    }
  }

  function paintBg(ctx) {
    ctx.fillStyle = C.bg; ctx.fillRect(0, 0, A.W, A.H);
    ctx.fillStyle = 'rgba(255,255,255,0.035)';
    for (var i = -A.H; i < A.W; i += 44) {
      ctx.beginPath();
      ctx.moveTo(i, A.H); ctx.lineTo(i + 22, A.H); ctx.lineTo(i + 22 + A.H, 0); ctx.lineTo(i + A.H, 0);
      ctx.closePath(); ctx.fill();
    }
  }

  A.register('menu', {
    enter: function () { pressed = -1; if (!bgBuf) bgBuf = A.buffer(A.W, A.H, paintBg); },
    draw: function (ctx) {
      ctx.drawImage(bgBuf, 0, 0);
      A.text('ARKADE', 486, 86, 84, C.coral, 'center');
      A.text('ARKADE', 480, 80, 84, C.cream, 'center');
      A.text('five games. one vita. zero loading screens.', 480, 142, 20, C.mustard, 'center', 'normal');
      for (var i = 0; i < GAMES.length; i++) {
        var g = GAMES[i], r = tileRect(i), lift = pressed === i ? 4 : 0;
        A.rr(r.x, r.y + 8, r.w, r.h, 18, 'rgba(0,0,0,0.4)');
        A.rr(r.x, r.y + lift, r.w, r.h, 18, g.color);
        A.rr(r.x + 10, r.y + 10 + lift, r.w - 20, 128, 12, 'rgba(255,255,255,0.28)');
        icon(g.id, r.x + r.w / 2, r.y + 74 + lift);
        A.text(g.name, r.x + r.w / 2, r.y + 170 + lift, 22, C.ink, 'center');
        A.text(g.tag, r.x + r.w / 2, r.y + 196 + lift, 15, 'rgba(13,20,38,0.7)', 'center', 'normal');
        A.rr(r.x + 12, r.y + 216 + lift, r.w - 24, 30, 8, 'rgba(13,20,38,0.85)');
        A.text(g.best(), r.x + r.w / 2, r.y + 231 + lift, 11, C.cream, 'center');
      }
      A.text('tap a cabinet', 480, 500, 14, C.dim, 'center', 'normal');
    },
    down: function (x, y) {
      pressed = -1;
      for (var i = 0; i < GAMES.length; i++) if (A.hit(tileRect(i), x, y)) pressed = i;
    },
    move: function (x, y) {
      if (pressed >= 0 && !A.hit(tileRect(pressed), x, y)) pressed = -1;
    },
    up: function (x, y) {
      var p = pressed;
      pressed = -1;
      if (p >= 0 && A.hit(tileRect(p), x, y)) A.go(GAMES[p].id);
    }
  });
})();

</script>
<script>
/*
  MEOWDOKU
  One cat per row, one per column, one per color. Cats can't touch, not even diagonally.
  Tap a cell: empty -> X -> cat -> empty. Drag after placing an X to X a whole run of cells.
*/
(function () {
  var A = ARK, C = A.C;
  var REG = ['#f6c667', '#8fd3c1', '#f49b8b', '#a9c5f0', '#c9a7e8', '#b7de8a', '#f3a6cf', '#e0c9a6'];

  var N = 6, region = [], marks = [], bad = [], cell = 0, ox = 0, oy = 0;
  var elapsed = 0, lastSec = -1, solved = false, dragMode = 0, lastCell = -1, newBest = false;

  var SIZES = [{ x: 700, y: 118, w: 70, h: 50, n: 6 }, { x: 780, y: 118, w: 70, h: 50, n: 7 }, { x: 860, y: 118, w: 70, h: 50, n: 8 }];
  var NEWP = { x: 700, y: 186, w: 230, h: 50 };
  var CLR = { x: 700, y: 248, w: 230, h: 50 };

  /* ---- puzzle generation ---- */
  function placeCats(n) {
    var cols = [], used = [];
    function bt(r) {
      if (r === n) return true;
      var order = A.shuffle(A.range(n));
      for (var i = 0; i < n; i++) {
        var c = order[i];
        if (used[c]) continue;
        if (r > 0 && Math.abs(cols[r - 1] - c) <= 1) continue;
        cols[r] = c; used[c] = true;
        if (bt(r + 1)) return true;
        used[c] = false;
      }
      return false;
    }
    bt(0);
    return cols;
  }

  function growRegions(n, cols) {
    var reg = [], i, filled = n, total = n * n;
    for (i = 0; i < total; i++) reg[i] = -1;
    for (i = 0; i < n; i++) reg[i * n + cols[i]] = i;
    var guard = 0;
    while (filled < total && guard < 100000) {
      guard++;
      /* uneven growth makes more interesting (and more often unique) shapes */
      var k = Math.random() < 0.45 ? A.randInt(Math.ceil(n / 2)) : A.randInt(n);
      var cand = [];
      for (i = 0; i < total; i++) {
        if (reg[i] !== k) continue;
        var r = Math.floor(i / n), c = i % n;
        if (r > 0 && reg[i - n] === -1) cand.push(i - n);
        if (r < n - 1 && reg[i + n] === -1) cand.push(i + n);
        if (c > 0 && reg[i - 1] === -1) cand.push(i - 1);
        if (c < n - 1 && reg[i + 1] === -1) cand.push(i + 1);
      }
      if (!cand.length) continue;
      reg[cand[A.randInt(cand.length)]] = k;
      filled++;
    }
    return reg;
  }

  function countSolutions(n, reg, limit) {
    var colU = [], regU = [], cols = [], count = 0;
    function bt(r) {
      if (count >= limit) return;
      if (r === n) { count++; return; }
      for (var c = 0; c < n; c++) {
        var g = reg[r * n + c];
        if (colU[c] || regU[g]) continue;
        if (r > 0 && Math.abs(cols[r - 1] - c) <= 1) continue;
        colU[c] = true; regU[g] = true; cols[r] = c;
        bt(r + 1);
        colU[c] = false; regU[g] = false;
      }
    }
    bt(0);
    return count;
  }

  function generate(n) {
    var reg = null;
    for (var t = 0; t < 80; t++) {
      reg = growRegions(n, placeCats(n));
      if (countSolutions(n, reg, 2) === 1) return reg;
    }

      var best = A.load('meow_best_' + N, 0);

        A.overlay('PURRFECT', 'Solved ' + N + 'x' + N + ' in ' + A.fmtTime(elapsed) + '\n' + (newBest ? 'new personal best' : 'best is ' + A.fmtTime(A.load('meow_best_' + N, 0))), C.mustard);
        A.btn(A.OV_A, 'NEXT PUZZLE', C.mint, C.ink, 18);

      }
    },
    down: function (x, y) {

      if (solved) return;
      var i = cellAt(x, y);

    },
    move: function (x, y) {
      if (solved || dragMode !== 1) return;
      var i = cellAt(x, y);
      if (i < 0 || i === lastCell) return;

      if (marks[i] === 0) marks[i] = 1;

    up: function (x, y) {

        if (A.hit(A.OV_A, x, y)) newPuzzle(N);
        else if (A.hit(A.OV_B, x, y)) A.go('menu');
        return;
      }
      if (A.hit(A.BACK, x, y)) { A.go('menu'); return; }

    }
  });

  /* ---------- geometry helpers ---------- */

          if (b.on && b.n !== 8 && type(b.n) === g) {
            var bx = x + 110 + k * 25, by = 44;
            if (b.n > 8) { A.circle(bx, by, 9, C.cream); A.circle(bx, by, 5, col(b.n)); } else A.circle(bx, by, 9, col(b.n));
            k++;

      }
    }
  }

  scene = {
    live: false,
    enter: function () {

    },
    update: function (dt) {
      if (state === 'roll') {
        for (var k = 0; k < 6; k++) step(dt / 6);
        if (!moving()) resolve();
      } else if (state === 'cpu') {
        cpuT += dt;
        var d = cpuPlan.ang - aimAng;
        while (d > Math.PI) d -= Math.PI * 2;
        while (d < -Math.PI) d += Math.PI * 2;
        aimAng += d * Math.min(1, dt * 5);
        if (cpuT > 0.7) power = Math.min(cpuPlan.pw, (cpuT - 0.7) * 1.4);
        if (cpuT > 1.5) { aimAng = cpuPlan.ang; shoot(cpuPlan.pw); }
      }

    },
    draw: function (ctx) {
      A.bg();
      ctx.drawImage(tableBuf, 0, 0);
      A.backBtn();
      if (state !== 'mode') drawHud();
      var i, cue = balls[0];

      for (i = 1; i < balls.length; i++) if (balls[i].on) drawBall(balls[i], balls[i].x, balls[i].y);
      if (cue.on) {
        if (state === 'place') {
          var ok = spotFree(cue.x, cue.y);
          A.circle(cue.x, cue.y, R + 6, null, ok ? C.mustard : C.coral, 2);
        }

      }

      if ((state === 'aim' || state === 'cpu') && cue.on) {
        var hit = castAim();

        ctx.globalAlpha = 0.75;

        A.circle(hit.x, hit.y, R, null, C.cream, 2);
        if (hit.ball) {
          var nx = hit.ball.x - hit.x, ny = hit.ball.y - hit.y, nl = Math.sqrt(nx * nx + ny * ny) || 1;
          A.line(hit.ball.x, hit.ball.y, hit.ball.x + nx / nl * 60, hit.ball.y + ny / nl * 60, C.mustard, 3);

        A.line(cue.x - ca * back, cue.y - sa * back, cue.x - ca * (back + 14), cue.y - sa * (back + 14), C.cream, 7);
      }

      /* power bar */
      A.rr(PB.x, PB.y, PB.w, PB.h, 14, C.bg2);
      var fillH = (PB.h - 12) * power;
      if (fillH > 1) A.rr(PB.x + 6, PB.y + 6, PB.w - 12, fillH, 10, power > 0.8 ? C.coral : C.mustard);
      A.text('PULL', PB.x + PB.w / 2, PB.y + PB.h + 20, 13, C.dim, 'center');
      A.text('DOWN', PB.x + PB.w / 2, PB.y + PB.h + 36, 13, C.dim, 'center');

      if (msg) A.text(msg, T.x + T.w / 2, 510, 17, C.cream, 'center');

      if (state === 'mode') {
        ctx.fillStyle = 'rgba(13,20,38,0.7)'; ctx.fillRect(0, 0, A.W, A.H);
        A.text('POOL', 480, 180, 56, C.mint, 'center');
        A.btn(MODE_CPU, 'VS CPU', C.mint, C.ink, 24);
        A.btn(MODE_2P, '2 PLAYERS, PASS THE VITA', C.cream, C.ink, 20);
        A.backBtn();
      }
      if (state === 'over') {
        var t = vsCpu ? (winner === 0 ? 'YOU WIN' : 'CPU WINS') : name(winner) + ' WINS';
        A.overlay(t, 'The 8 has spoken.\n' + (vsCpu ? A.load('pool_wins', 0) + ' career wins vs CPU' : ''), C.mint);
        A.btn(A.OV_A, 'REMATCH', C.mint, C.ink, 20);
        A.btn(A.OV_B, 'MENU', C.bg2, C.cream, 20);
      }
    },
    down: function (x, y) {
      powerDrag = false;
      if (state === 'aim' && !isCpu()) {
        if (A.hit({ x: PB.x - 20, y: PB.y - 20, w: PB.w + 40, h: PB.h + 40 }, x, y)) {
          powerDrag = true; power = A.clamp((y - PB.y) / PB.h, 0, 1);
        } else if (x > T.x - 40 && x < T.x + T.w + 40 && y > T.y - 40 && y < T.y + T.h + 40) {
          aimAng = Math.atan2(y - balls[0].y, x - balls[0].x);
        }
      } else if (state === 'place') {
        balls[0].x = A.clamp(x, T.x + R, T.x + T.w - R); balls[0].y = A.clamp(y, T.y + R, T.y + T.h - R);
      }
    },
    move: function (x, y) {
      if (state === 'aim' && !isCpu()) {
        if (powerDrag) power = A.clamp((y - PB.y) / PB.h, 0, 1);
        else if (x < PB.x - 20) aimAng = Math.atan2(y - balls[0].y, x - balls[0].x);
      } else if (state === 'place') {
        balls[0].x = A.clamp(x, T.x + R, T.x + T.w - R); balls[0].y = A.clamp(y, T.y + R, T.y + T.h - R);
      }
    },
    up: function (x, y) {
      if (state === 'mode') {
        if (A.hit(MODE_CPU, x, y)) { vsCpu = true; reset(); }
        else if (A.hit(MODE_2P, x, y)) { vsCpu = false; reset(); }
        else if (A.hit(A.BACK, x, y)) A.go('menu');
        return;
      }
      if (state === 'over') {
        if (A.hit(A.OV_A, x, y)) reset();
        else if (A.hit(A.OV_B, x, y)) A.go('menu');
        return;
      }
      if (A.hit(A.BACK, x, y) && !powerDrag) { A.go('menu'); return; }
      if (state === 'aim' && powerDrag) {
        powerDrag = false;
        if (power > 0.03) shoot(power); else power = 0;
      } else if (state === 'place') {
        if (spotFree(balls[0].x, balls[0].y)) { state = 'aim'; msg = name(turn) + ': aim and shoot.'; }
      }
    }
  };
  A.register('pool', scene);
})();

<script>
/*
  GOLF: 9 holes of top-down mini golf.
  Drag anywhere to pull back (like a slingshot), lift to putt.
  Sand slows you down, water costs a stroke, the sliding walls don't care about your feelings.
*/
(function () {
  var A = ARK, C = A.C;
  var F = { x: 40, y: 80, w: 880, h: 440 };
  var BR = 8, CUP = 12, MAXP = 150, MAXS = 950;

  var HOLES = [
    { par: 2, tee: [140, 300], cup: [820, 300], walls: [[450, 230, 40, 140]] },
    { par: 3, tee: [130, 440], cup: [820, 150], walls: [[400, 80, 40, 320]] },
    { par: 3, tee: [150, 150], cup: [820, 440], walls: [[320, 80, 36, 320], [620, 200, 36, 320]] },
    { par: 3, tee: [140, 300], cup: [760, 300], walls: [[330, 170, 30, 30], [330, 400, 30, 30], [520, 285, 30, 30]],
      sand: [[680, 200, 170, 50], [680, 350, 170, 50], [820, 250, 60, 100]] },
    { par: 3, tee: [140, 430], cup: [820, 160], walls: [], water: [[390, 80, 190, 170], [390, 330, 190, 190]] },
    { par: 4, tee: [120, 300], cup: [840, 300], walls: [],
      movers: [{ r: [300, 250, 26, 110], range: 150, speed: 1.3, ph: 0 }, { r: [480, 250, 26, 110], range: 150, speed: 1.7, ph: 2 }, { r: [660, 250, 26, 110], range: 150, speed: 1.1, ph: 4 }] },
    { par: 3, tee: [140, 140], cup: [820, 150], walls: [[690, 80, 24, 220], [260, 220, 300, 24]], sand: [[80, 380, 200, 100]] },
    { par: 4, tee: [130, 130], cup: [830, 160], walls: [[250, 80, 30, 330], [450, 190, 30, 330], [650, 80, 30, 330]], sand: [[480, 90, 170, 60]] },
    { par: 3, tee: [140, 300], cup: [820, 300], walls: [[400, 275, 50, 50], [560, 200, 40, 40], [560, 360, 40, 40]],
      water: [[40, 80, 880, 70], [40, 450, 880, 70]], movers: [{ r: [690, 250, 24, 100], range: 110, speed: 1.5, ph: 1 }] }
  ];

  var hi, strokes, ball, last, state, drag, anim, label, walls, card, scene, newBest;
  var NEXT = { x: 380, y: 300, w: 200, h: 54 };

  function hole() { return HOLES[hi]; }

  function startHole(i) {
    hi = i;
    var h = hole();
    ball = { x: h.tee[0], y: h.tee[1], vx: 0, vy: 0, s: 1 };
    last = { x: ball.x, y: ball.y };
    strokes[hi] = 0;
    state = 'aim'; drag = null; anim = 0; label = '';
    walls = currentWalls();
  }

  function newRound() { strokes = []; newBest = false; startHole(0); }

  function currentWalls() {
    var h = hole(), list = [], i;
    list.push([F.x - 30, F.y - 30, F.w + 60, 30], [F.x - 30, F.y + F.h, F.w + 60, 30],
      [F.x - 30, F.y, 30, F.h], [F.x + F.w, F.y, 30, F.h]);
    for (i = 0; i < h.walls.length; i++) list.push(h.walls[i]);
    if (h.movers) {
      for (i = 0; i < h.movers.length; i++) {
        var m = h.movers[i], off = Math.sin(A.time * m.speed + m.ph) * m.range;
        var y = A.clamp(m.r[1] + off, F.y, F.y + F.h - m.r[3]);
        list.push([m.r[0], y, m.r[2], m.r[3]]);
      }
    }
    return list;
  }

  function inRects(list, x, y) {
    if (!list) return false;
    for (var i = 0; i < list.length; i++) {
      var r = list[i];
      if (x >= r[0] && x <= r[0] + r[2] && y >= r[1] && y <= r[1] + r[3]) return true;
    }
    return false;
  }

  function collide(list) {
    for (var i = 0; i < list.length; i++) {
      var r = list[i];
      var cx = A.clamp(ball.x, r[0], r[0] + r[2]), cy = A.clamp(ball.y, r[1], r[1] + r[3]);
      var dx = ball.x - cx, dy = ball.y - cy, d2 = dx * dx + dy * dy;
      if (d2 >= BR * BR) continue;
      var nx, ny, d;
      if (d2 === 0) {
        /* center got inside (fast mover): push out along the shallowest side */
        var l = ball.x - r[0], rr = r[0] + r[2] - ball.x, t = ball.y - r[1], b = r[1] + r[3] - ball.y;
        var m = Math.min(l, rr, t, b);
        nx = m === l ? -1 : (m === rr ? 1 : 0); ny = m === t ? -1 : (m === b ? 1 : 0);
        if (nx !== 0) ny = 0;
        ball.x = nx < 0 ? r[0] - BR : (nx > 0 ? r[0] + r[2] + BR : ball.x);
        ball.y = ny < 0 ? r[1] - BR : (ny > 0 ? r[1] + r[3] + BR : ball.y);
      } else {
        d = Math.sqrt(d2); nx = dx / d; ny = dy / d;
        ball.x = cx + nx * BR; ball.y = cy + ny * BR;
      }

      if (vn < 0) { ball.vx -= 1.8 * vn * nx; ball.vy -= 1.8 * vn * ny; }
    }
  }

  function sink() {
    state = 'sunk'; anim = 0;
    var h = hole(), s = strokes[hi], d = s - h.par;
    label = s === 1 ? 'HOLE IN ONE' : (d <= -2 ? 'EAGLE' : d === -1 ? 'BIRDIE' : d === 0 ? 'PAR' : d === 1 ? 'BOGEY' : '+' + d + ', WE MOVE');
  }

  function total() { var t = 0; for (var i = 0; i < strokes.length; i++) t += strokes[i] || 0; return t; }
  function parTo(n) { var t = 0; for (var i = 0; i < n; i++) t += HOLES[i].par; return t; }

  function finishRound() {
    state = 'card';
    var t = total(), b = A.load('golf_best', 0);
    if (!b || t < b) { A.save('golf_best', t); newBest = true; }
  }

  function physics(dt) {
    var h = hole(), sub = 4, k;
    for (k = 0; k < sub; k++) {
      var st = dt / sub;
      ball.x += ball.vx * st; ball.y += ball.vy * st;
      collide(walls);
      var sp = Math.sqrt(ball.vx * ball.vx + ball.vy * ball.vy);
      var dc = A.dist(ball.x, ball.y, h.cup[0], h.cup[1]);
      if (dc < CUP) {
        if (sp < 430) { ball.x = h.cup[0]; ball.y = h.cup[1]; ball.vx = ball.vy = 0; sink(); return; }
      } else if (dc < CUP + 10 && sp < 300) {
        ball.vx += (h.cup[0] - ball.x) / dc * 260 * st;
        ball.vy += (h.cup[1] - ball.y) / dc * 260 * st;
      }
      if (inRects(h.water, ball.x, ball.y)) {
        strokes[hi]++;
        ball.x = last.x; ball.y = last.y; ball.vx = ball.vy = 0;
        label = 'SPLASH  +1'; anim = 0;
        state = 'aim';
        return;
      }
      var fr = inRects(h.sand, ball.x, ball.y) ? 720 : 190;
      if (sp > 0) {
        var ns = sp - fr * st;
        if (ns < 5) { ball.vx = ball.vy = 0; } else { ball.vx *= ns / sp; ball.vy *= ns / sp; }
      }
    }
    if (ball.vx === 0 && ball.vy === 0) {
      state = 'aim';
      if (strokes[hi] >= 10) { strokes[hi] = 10; sink(); label = 'PICKED UP AT 10'; }
    }
  }

  function drawGrass(ctx) {
    ctx.fillStyle = '#2f8f5b'; ctx.fillRect(F.x, F.y, F.w, F.h);
    ctx.fillStyle = '#34995f';
    for (var i = 0; i < F.w; i += 80) ctx.fillRect(F.x + i, F.y, 40, F.h);
  }

  function drawRects(list, fill, edge) {
    if (!list) return;
    for (var i = 0; i < list.length; i++) {
      var r = list[i];
      A.rr(r[0], r[1], r[2], r[3], 6, fill, edge, 2);
    }
  }

  scene = {
    live: false,
    enter: function () { newRound(); },
    update: function (dt) {
      walls = currentWalls();
      var h = hole();
      if (state === 'roll') physics(dt);
      else if (state === 'aim' && h.movers) collide(walls);
      if (state === 'sunk') anim += dt;
      if (label && state !== 'sunk') { anim += dt; if (anim > 1.4) { label = ''; A.dirty = true; } }
      scene.live = state === 'roll' || state === 'sunk' || !!h.movers || !!label;
    },
    draw: function (ctx) {
      var h = hole(), i;
      A.bg();
      A.backBtn();
      A.text('HOLE ' + (hi + 1) + ' / 9', 130, 31, 22, C.sky);
      A.text('PAR ' + h.par, 300, 31, 22, C.cream);
      A.text('STROKES ' + strokes[hi], 420, 31, 22, C.cream);
      var d = total() - (strokes[hi] || 0) - parTo(hi);
      A.text('ROUND ' + (hi === 0 ? 'E' : (d > 0 ? '+' + d : d === 0 ? 'E' : String(d))), 920, 31, 22, C.mustard, 'right');

      A.rr(F.x - 14, F.y - 14, F.w + 28, F.h + 28, 18, '#1b5e3b');
      drawGrass(ctx);
      if (h.water) {
        drawRects(h.water, '#2f7fc1', null);
        ctx.fillStyle = 'rgba(255,255,255,0.18)';
        for (i = 0; i < h.water.length; i++) {
          var w = h.water[i];
          for (var yy = w[1] + 16; yy < w[1] + w[3]; yy += 26) ctx.fillRect(w[0] + 12 + (yy % 52 ? 20 : 0), yy, 30, 3);
        }
      }
      drawRects(h.sand, '#e9d3a0', null);
      A.circle(h.tee[0], h.tee[1], 14, 'rgba(255,255,255,0.12)');

      /* cup + flag */
      A.circle(h.cup[0], h.cup[1], CUP + 3, '#1c6b42');
      A.circle(h.cup[0], h.cup[1], CUP, '#0d1f16');
      A.line(h.cup[0], h.cup[1], h.cup[0], h.cup[1] - 44, C.cream, 3);
      ctx.fillStyle = C.coral; ctx.beginPath();
      ctx.moveTo(h.cup[0], h.cup[1] - 44); ctx.lineTo(h.cup[0] + 26, h.cup[1] - 36); ctx.lineTo(h.cup[0], h.cup[1] - 28); ctx.closePath(); ctx.fill();

      /* walls (skip the 4 outer ones) */
      for (i = 4; i < walls.length; i++) {
        var r = walls[i];
        A.rr(r[0] + 3, r[1] + 5, r[2], r[3], 6, 'rgba(0,0,0,0.3)');
        A.rr(r[0], r[1], r[2], r[3], 6, C.cream, '#c9bfa6', 2);
      }

      /* aim guide */
      if (state === 'aim' && drag) {
        var px = drag.sx - drag.x, py = drag.sy - drag.y, pl = Math.sqrt(px * px + py * py);
        if (pl > 8) {
          var p = Math.min(pl, MAXP) / MAXP, ux = px / pl, uy = py / pl, len = 30 + p * 170;
          for (var t = 14; t < len; t += 14) A.circle(ball.x + ux * t, ball.y + uy * t, 3, p > 0.85 ? C.coral : C.cream);
          A.rr(ball.x - 30, ball.y + 18, 60, 8, 4, 'rgba(0,0,0,0.4)');
          A.rr(ball.x - 30, ball.y + 18, 60 * p, 8, 4, p > 0.85 ? C.coral : C.mustard);
        }
      }

      /* ball */
      if (state !== 'card') {
        var s = state === 'sunk' ? Math.max(0, 1 - anim * 3) : 1;
        if (s > 0) {
          A.circle(ball.x + 2, ball.y + 3, BR * s, 'rgba(0,0,0,0.35)');
          A.circle(ball.x, ball.y, BR * s, '#ffffff');
          A.circle(ball.x - 2, ball.y - 2, BR * 0.3 * s, '#e9e9e9');
        }
      }

      if (label && state !== 'card') {
        A.rr(330, 240, 300, 64, 16, 'rgba(13,20,38,0.85)');
        A.text(label, 480, 272, 26, C.mustard, 'center');
      }
      if (state === 'sunk' && anim > 0.5) {
        A.btn(NEXT, hi === 8 ? 'SCORECARD' : 'NEXT HOLE', C.sky, C.ink, 20);
      }
      if (state === 'aim' && strokes[hi] === 0 && !drag && !label) {
        A.text('drag back anywhere, lift to putt', 480, 536, 13, C.dim, 'center', 'normal');
      }

      if (state === 'card') {
        ctx.fillStyle = 'rgba(13,20,38,0.85)'; ctx.fillRect(0, 0, A.W, A.H);
        A.rr(90, 110, 780, 320, 22, C.cream);
        A.text('SCORECARD', 480, 150, 30, C.ink, 'center');
        var cw = 64, x0 = 130;
        A.text('HOLE', x0, 210, 14, C.ink); A.text('PAR', x0, 250, 14, C.ink); A.text('YOU', x0, 290, 14, C.ink);
        for (i = 0; i < 9; i++) {
          var cx = x0 + 90 + i * cw;
          A.text(String(i + 1), cx, 210, 16, C.ink, 'center');
          A.text(String(HOLES[i].par), cx, 250, 16, 'rgba(13,20,38,0.6)', 'center');
          var sc = strokes[i], dd = sc - HOLES[i].par;
          if (dd < 0) A.circle(cx, 290, 15, C.mint);
          if (dd > 0) A.rr(cx - 14, 276, 28, 28, 4, '#f2c9b8');
          A.text(String(sc), cx, 290, 18, C.ink, 'center');
        }
        var tt = total(), dp = tt - parTo(9);
        A.text('TOTAL ' + tt + '   (' + (dp > 0 ? '+' + dp : dp === 0 ? 'EVEN' : String(dp)) + ')', 480, 345, 24, C.ink, 'center');
        A.text(newBest ? 'new best round' : 'best ' + A.load('golf_best', 0), 480, 378, 16, 'rgba(13,20,38,0.6)', 'center', 'normal');
        A.btn({ x: 260, y: 450, w: 210, h: 54 }, 'PLAY AGAIN', C.sky, C.ink, 20);
        A.btn({ x: 490, y: 450, w: 210, h: 54 }, 'MENU', C.bg2, C.cream, 20);
      }
    },
    down: function (x, y) {
      if (state === 'aim') drag = { sx: x, sy: y, x: x, y: y };
    },
    move: function (x, y) {
      if (drag) { drag.x = x; drag.y = y; }
    },
    up: function (x, y) {
      if (state === 'card') {
        if (A.hit({ x: 260, y: 450, w: 210, h: 54 }, x, y)) newRound();
        else if (A.hit({ x: 490, y: 450, w: 210, h: 54 }, x, y)) A.go('menu');
        return;
      }
      if (state === 'sunk') {
        if (anim > 0.5 && A.hit(NEXT, x, y)) { if (hi === 8) finishRound(); else startHole(hi + 1); }
        return;
      }
      if (drag && state === 'aim') {
        var px = drag.sx - x, py = drag.sy - y, pl = Math.sqrt(px * px + py * py);
        var wasDrag = pl > 10;
        drag = null;
        if (wasDrag) {
          var p = Math.min(pl, MAXP) / MAXP;
          ball.vx = px / pl * p * MAXS; ball.vy = py / pl * p * MAXS;
          last = { x: ball.x, y: ball.y };
          strokes[hi]++;
          state = 'roll'; label = '';
          return;
        }
      }
      if (A.hit(A.BACK, x, y)) A.go('menu');
    }
  };
  A.register('golf', scene);
})();

<script>
/*
  DARTS
  Press and hold to bring up the reticle (it floats above your thumb so you can see it).
  Your hand is shaky at first, steadiest after a beat, then gets tired. Lift to throw.
  Modes: 301 vs CPU (straight out, bust resets the turn) or Count Up (8 rounds, solo high score).
*/
(function () {
  var A = ARK, C = A.C;
  var CX = 300, CY = 300, S = 190 / 170;
  var R_BULL = 6.35 * S, R_OBULL = 15.9 * S, R_TIN = 99 * S, R_TOUT = 107 * S, R_DIN = 162 * S, R_DOUT = 170 * S;
  var ORDER = [20, 1, 18, 4, 13, 6, 10, 15, 2, 17, 3, 19, 7, 16, 8, 11, 14, 9, 12, 5];
  var M301 = { x: 300, y: 240, w: 360, h: 60 }, MCNT = { x: 300, y: 320, w: 360, h: 60 };
  var CONT = { x: 660, y: 440, w: 260, h: 56 };

  var mode, state, scores, cur, darts, turnStart, round, holding, holdT, finger, lastHit, cpuT, boardBuf = null, scene, total, banner;

  function scoreAt(x, y) {
    var dx = x - CX, dy = y - CY, r = Math.sqrt(dx * dx + dy * dy);
    if (r <= R_BULL) return { pts: 50, label: 'BULL' };
    if (r <= R_OBULL) return { pts: 25, label: '25' };
    if (r > R_DOUT) return { pts: 0, label: 'MISS' };
    var ang = Math.atan2(dx, -dy) * 180 / Math.PI;
    ang = ((ang + 9) % 360 + 360) % 360;
    var n = ORDER[Math.floor(ang / 18)];
    if (r > R_TIN && r <= R_TOUT) return { pts: n * 3, label: 'T' + n };
    if (r > R_DIN) return { pts: n * 2, label: 'D' + n };
    return { pts: n, label: String(n) };
  }

  function pointFor(n, r) {
    var a = ORDER.indexOf(n) * 18 * Math.PI / 180;
    return { x: CX + Math.sin(a) * r, y: CY - Math.cos(a) * r };
  }

  function cpuTarget(rem) {
    if (rem === 50) return { x: CX, y: CY };
    if (rem > 60) return pointFor(20, (R_TIN + R_TOUT) / 2);
    if (rem <= 20) return pointFor(rem, (R_TOUT + R_DIN) / 2);
    if (rem % 3 === 0) return pointFor(rem / 3, (R_TIN + R_TOUT) / 2);
    if (rem % 2 === 0 && rem <= 40) return pointFor(rem / 2, (R_DIN + R_DOUT) / 2);
    if (rem === 25) return { x: CX, y: CY };
    return pointFor(20, (R_TOUT + R_DIN) / 2);
  }

  function paintBoard(ctx) {
    ctx.clearRect(0, 0, A.W, A.H);
    A.circle(CX + 6, CY + 8, 236, 'rgba(0,0,0,0.35)');
    A.circle(CX, CY, 236, '#241a14');
    A.circle(CX, CY, 232, '#111');
    var rings = [[R_DOUT, true], [R_DIN, false], [R_TOUT, true], [R_TIN, false]];
    for (var k = 0; k < rings.length; k++) {
      for (var i = 0; i < 20; i++) {
        var a0 = (-90 + i * 18 - 9) * Math.PI / 180, a1 = a0 + 18 * Math.PI / 180;
        ctx.beginPath(); ctx.moveTo(CX, CY); ctx.arc(CX, CY, rings[k][0], a0, a1, false); ctx.closePath();
        ctx.fillStyle = rings[k][1] ? (i % 2 ? '#1e8a4c' : '#d6332b') : (i % 2 ? C.cream : '#1a1a1a');
        ctx.fill();
      }
    }
    A.circle(CX, CY, R_OBULL, '#1e8a4c');
    A.circle(CX, CY, R_BULL, '#d6332b');
    ctx.strokeStyle = 'rgba(200,200,200,0.35)'; ctx.lineWidth = 1;
    for (i = 0; i < 20; i++) {
      var a = (-90 + i * 18 - 9) * Math.PI / 180;
      ctx.beginPath();
      ctx.moveTo(CX + Math.cos(a) * R_OBULL, CY + Math.sin(a) * R_OBULL);
      ctx.lineTo(CX + Math.cos(a) * R_DOUT, CY + Math.sin(a) * R_DOUT);
      ctx.stroke();
    }
    for (i = 0; i < 20; i++) {
      var p = pointFor(ORDER[i], 212);
      A.text(String(ORDER[i]), p.x, p.y, 20, C.cream, 'center');
    }
  }

  function wobbleAmp(t) {
    if (t < 0.6) return 22 - 16 * (t / 0.6);
    if (t < 2) return 6;
    return Math.min(34, 6 + (t - 2) * 14);
  }
  function reticle() {
    var a = wobbleAmp(holdT), t = A.time;
    return {
      x: finger.x + Math.sin(t * 2.3) * a + Math.sin(t * 5.1) * a * 0.4,
      y: finger.y - 80 + Math.cos(t * 1.9) * a * 0.8 + Math.sin(t * 4.3) * a * 0.3
    };
  }

  function start(m) {
    mode = m;
    scores = m === '301' ? [301, 301] : [0];
    cur = 0; darts = []; round = 1; turnStart = scores[0];
    state = 'throw'; holding = false; lastHit = null; banner = '';
  }

  function land(x, y) {
    var h = scoreAt(x, y);
    darts.push({ x: x, y: y, t: 0 });
    lastHit = h;
    if (mode === 'count') {
      scores[0] += h.pts;
    } else {
      var rem = scores[cur] - h.pts;
      if (rem < 0) { scores[cur] = turnStart; banner = 'BUST'; state = 'turnEnd'; cpuT = 0; return; }
      scores[cur] = rem;
      if (rem === 0) {
        state = 'over';
        if (cur === 0) A.save('darts_301_wins', A.load('darts_301_wins', 0) + 1);
        return;
      }
    }
    if (darts.length >= 3) { state = 'turnEnd'; cpuT = 0; banner = ''; }
  }

  function nextTurn() {
    darts = []; banner = ''; lastHit = null;
    if (mode === 'count') {
      if (round >= 8) {
        state = 'over';
        var b = A.load('darts_best', 0);
        if (scores[0] > b) A.save('darts_best', scores[0]);
        return;
      }
      round++;
    } else {
      cur = 1 - cur;
      if (cur === 0) round++;
    }
    turnStart = scores[cur];
    state = (mode === '301' && cur === 1) ? 'cpu' : 'throw';
    cpuT = 0;
  }

  scene = {
    live: false,
    enter: function () {
      if (!boardBuf) boardBuf = A.buffer(A.W, A.H, paintBoard);
      state = 'mode'; darts = []; holding = false;
    },
    update: function (dt) {
      var i;
      for (i = 0; i < darts.length; i++) darts[i].t += dt;
      if (holding) holdT += dt;
      if (state === 'cpu') {
        cpuT += dt;
        if (cpuT > 0.8) {
          cpuT = 0;
          var tg = cpuTarget(scores[1]);
          land(tg.x + A.gauss() * 17, tg.y + A.gauss() * 17);
        }
      } else if (state === 'turnEnd' && mode === '301' && cur === 1) {
        cpuT += dt;
        if (cpuT > 1.2) nextTurn();
      }
      var anim = false;
      for (i = 0; i < darts.length; i++) if (darts[i].t < 0.3) anim = true;
      scene.live = holding || state === 'cpu' || anim || (state === 'turnEnd' && cur === 1);
    },
    draw: function (ctx) {
      A.bg();
      if (state !== 'mode') ctx.drawImage(boardBuf, 0, 0);
      A.backBtn();

      var i;
      for (i = 0; i < darts.length; i++) {
        var d = darts[i], k = Math.min(1, d.t / 0.25), s = 1 + (1 - k) * 1.5;
        A.line(d.x, d.y, d.x + 22 * s, d.y - 26 * s, '#cfcfcf', 3);
        ctx.fillStyle = cur === 1 && mode === '301' ? C.sky : C.mustard;
        ctx.beginPath(); ctx.moveTo(d.x + 18 * s, d.y - 30 * s); ctx.lineTo(d.x + 34 * s, d.y - 34 * s); ctx.lineTo(d.x + 28 * s, d.y - 18 * s); ctx.closePath(); ctx.fill();
        A.circle(d.x, d.y, 3, '#fff');
      }

      if (holding && state === 'throw') {
        var r = reticle();
        A.circle(r.x, r.y, 12, null, C.mustard, 3);
        A.line(r.x - 18, r.y, r.x - 6, r.y, C.mustard, 2); A.line(r.x + 6, r.y, r.x + 18, r.y, C.mustard, 2);
        A.line(r.x, r.y - 18, r.x, r.y - 6, C.mustard, 2); A.line(r.x, r.y + 6, r.x, r.y + 18, C.mustard, 2);
        A.circle(r.x, r.y, 2, C.mustard);
      }

      /* side panel */
      if (state !== 'mode') {
        A.rr(610, 70, 330, 460, 20, C.bg2);
        A.text(mode === '301' ? '301 VS CPU' : 'COUNT UP', 640, 104, 22, C.coral);
        A.text(mode === '301' ? 'ROUND ' + round : 'ROUND ' + round + ' / 8', 910, 104, 16, C.dim, 'right');
        if (mode === '301') {
          for (var p = 0; p < 2; p++) {
            var y = 140 + p * 96, act = cur === p;
            A.rr(630, y, 290, 82, 14, act ? C.coral : C.bg);
            A.text(p === 0 ? 'YOU' : 'CPU', 650, y + 26, 16, act ? C.ink : C.dim);
            A.text(String(scores[p]), 900, y + 44, 44, act ? C.ink : C.cream, 'right');
          }
        } else {
          A.rr(630, 140, 290, 178, 14, C.coral);
          A.text('SCORE', 650, 170, 16, C.ink);
          A.text(String(scores[0]), 775, 245, 72, C.ink, 'center');
          A.text('BEST ' + A.load('darts_best', 0), 650, 298, 14, 'rgba(13,20,38,0.7)');
        }
        for (i = 0; i < 3; i++) {
          var dx = 640 + i * 96;
          A.rr(dx, 344, 86, 56, 12, i < darts.length ? C.cream : 'rgba(244,236,216,0.12)');
          if (i < darts.length) A.text(scoreAt(darts[i].x, darts[i].y).label, dx + 43, 372, 20, C.ink, 'center');
        }
        if (banner) A.text(banner, 775, 420, 30, C.coral, 'center');
        else if (lastHit && state === 'throw') A.text(lastHit.label + '  +' + lastHit.pts, 775, 420, 22, C.mustard, 'center');
        if (state === 'turnEnd' && !(mode === '301' && cur === 1)) A.btn(CONT, mode === '301' ? 'PASS TO CPU' : 'NEXT ROUND', C.mustard, C.ink, 20);
        if (state === 'cpu' || (state === 'turnEnd' && cur === 1)) A.text('CPU is throwing...', 775, 470, 18, C.sky, 'center');
        if (state === 'throw' && darts.length === 0) A.wrap('Hold anywhere, the reticle floats above your thumb. Steadiest after a beat. Lift to throw.', 632, 462, 290, 13, C.dim, 18);
      }

      if (state === 'mode') {
        A.text('DARTS', 480, 170, 56, C.coral, 'center');
        A.btn(M301, '301 VS CPU', C.coral, C.ink, 24);
        A.btn(MCNT, 'COUNT UP (SOLO)', C.cream, C.ink, 22);
        A.text('best count up: ' + A.load('darts_best', 0) + '    301 wins: ' + A.load('darts_301_wins', 0), 480, 420, 16, C.dim, 'center', 'normal');
      }
      if (state === 'over') {
        var title, sub;
        if (mode === '301') { title = cur === 0 ? 'YOU CHECKED OUT' : 'CPU CHECKS OUT'; sub = cur === 0 ? 'Clean.\nround ' + round : 'It left you on ' + scores[0] + '.\nrun it back'; }
        else { title = 'FINAL ' + scores[0]; sub = (scores[0] >= A.load('darts_best', 0) ? 'new best' : 'best is ' + A.load('darts_best', 0)) + '\n8 rounds, 24 darts'; }
        A.overlay(title, sub, C.coral);
        A.btn(A.OV_A, 'AGAIN', C.coral, C.ink, 20);
        A.btn(A.OV_B, 'MENU', C.bg2, C.cream, 20);
      }
    },
    down: function (x, y) {
      if (state === 'throw' && x < 600 && !A.hit(A.BACK, x, y)) {
        holding = true; holdT = 0; finger = { x: x, y: y };
      }
    },
    move: function (x, y) {
      if (holding) { finger.x = x; finger.y = y; }
    },
    up: function (x, y) {
      if (holding) {
        holding = false;
        if (state === 'throw') {
          var r = reticle();
          land(r.x + A.gauss() * 3, r.y + A.gauss() * 3);
        }
        return;
      }
      if (state === 'mode') {
        if (A.hit(M301, x, y)) start('301');
        else if (A.hit(MCNT, x, y)) start('count');
        else if (A.hit(A.BACK, x, y)) A.go('menu');
        return;
      }
      if (state === 'over') {
        if (A.hit(A.OV_A, x, y)) start(mode);
        else if (A.hit(A.OV_B, x, y)) A.go('menu');
        return;
      }
      if (state === 'turnEnd' && !(mode === '301' && cur === 1) && A.hit(CONT, x, y)) { nextTurn(); return; }
      if (A.hit(A.BACK, x, y)) A.go('menu');
    }
  };
  A.register('darts', scene);
})();

<script>
/*
  WHO DIS?  An original face-guessing game vs a bot.
  You and the bot each get a secret face. Ask yes/no questions, faces that don't fit flip down.
  Tap GUESS then a face when you're sure. Wrong guess = you lose, so don't be reckless.
*/
(function () {
  var A = ARK, C = A.C;
  var NAMES = ['JUNO', 'RICO', 'TAVI', 'MABEL', 'OTIS', 'ZURI', 'PIM', 'DEX', 'NIA', 'BRUNO', 'LULU', 'CYD',
    'OMAR', 'FERN', 'KIP', 'RHEA', 'MOSS', 'TESS', 'IKE', 'VERA', 'ZIGGY', 'WREN', 'SOL', 'BEA'];
  var HAIR = { black: '#1d1a1a', brown: '#6b4226', blonde: '#e8c65a', red: '#c8512b', white: '#e9e6df' };
  var HAIRS = ['black', 'brown', 'blonde', 'red', 'white'];
  var SKIN = ['#f3d2b3', '#e2b48c', '#c68b5e', '#9a6440', '#6b4128'];
  var SHIRT = ['#e8604c', '#5fbfa0', '#7fb7e0', '#f2b134', '#b79be8', '#f3a6cf', '#2f4a7a'];
  var Q = [
    { q: 'Wearing a hat?', f: function (c) { return c.hat; } },
    { q: 'Glasses?', f: function (c) { return c.glasses; } },
    { q: 'Facial hair?', f: function (c) { return c.beard; } },
    { q: 'Earrings?', f: function (c) { return c.earrings; } },
    { q: 'Bald?', f: function (c) { return c.style === 'bald'; } },
    { q: 'Long hair?', f: function (c) { return c.style === 'long'; } },
    { q: 'Curly hair?', f: function (c) { return c.style === 'curly'; } },
    { q: 'Black hair?', f: function (c) { return c.hair === 'black'; } },
    { q: 'Brown hair?', f: function (c) { return c.hair === 'brown'; } },
    { q: 'Blonde hair?', f: function (c) { return c.hair === 'blonde'; } },
    { q: 'Red hair?', f: function (c) { return c.hair === 'red'; } },
    { q: 'White hair?', f: function (c) { return c.hair === 'white'; } },
    { q: 'Smiling?', f: function (c) { return c.smile; } },
    { q: 'Rosy cheeks?', f: function (c) { return c.cheeks; } }
  ];
  var CW = 88, CH = 104, GX = 24, GY = 72, GAP = 6;
  var GUESS = { x: 612, y: 480, w: 328, h: 44 };

  var faces, you, bot, botCands, askedYou, askedBot, state, guessing, logYou, logBot, botT, result, scene;

  /* Park-Miller PRNG so the cast looks the same every game (only the secrets change) */
  var seed = 1;
  function rnd() { seed = seed * 16807 % 2147483647; return (seed - 1) / 2147483646; }
  function pick(a) { return a[Math.floor(rnd() * a.length)]; }

  function buildCast() {
    seed = 20260926;
    var list = [], seen = {}, guard = 0;
    while (list.length < 24 && guard < 5000) {
      guard++;
      var r = rnd(), style = r < 0.15 ? 'bald' : r < 0.5 ? 'short' : r < 0.8 ? 'long' : 'curly';
      var c = {
        style: style,
        hair: style === 'bald' ? 'none' : pick(HAIRS),
        hat: rnd() < 0.28, glasses: rnd() < 0.35, beard: rnd() < 0.3, earrings: rnd() < 0.3,
        smile: rnd() < 0.55, cheeks: rnd() < 0.35, skin: pick(SKIN), shirt: pick(SHIRT)
      };
      var sig = [c.style, c.hair, c.hat, c.glasses, c.beard, c.earrings, c.smile, c.cheeks].join('|');
      if (seen[sig]) continue;
      seen[sig] = true;
      list.push(c);
    }
    for (var i = 0; i < list.length; i++) list[i].name = NAMES[i];
    return list;
  }

  function newGame() {
    if (!faces) faces = buildCast();
    for (var i = 0; i < faces.length; i++) { faces[i].down = false; faces[i].flip = 1; }
    you = faces[A.randInt(24)];
    do { bot = faces[A.randInt(24)]; } while (bot === you);
    botCands = faces.slice();
    askedYou = {}; askedBot = {};
    state = 'you'; guessing = false; result = '';
    logYou = 'Your move. Ask something.'; logBot = 'Bot is waiting.';
  }

  function upCount() { var k = 0; for (var i = 0; i < faces.length; i++) if (!faces[i].down) k++; return k; }

  function ask(i) {
    var q = Q[i], ans = q.f(bot);
    askedYou[i] = true;
    for (var j = 0; j < faces.length; j++) {
      var f = faces[j];
      if (!f.down && q.f(f) !== ans) { f.down = true; f.flip = 0; }
    }
    logYou = 'YOU: ' + q.q + '  ' + (ans ? 'YES' : 'NO');
    state = 'bot'; botT = 0;
  }

  function botMove() {
    if (botCands.length === 1) {
      logBot = 'BOT: Is it ' + botCands[0].name + '?  ...yep.';
      end(false, 'The bot read you like a menu.');
      return;
    }
    var best = -1, bestScore = 1e9;
    for (var i = 0; i < Q.length; i++) {
      if (askedBot[i]) continue;
      var yes = 0;
      for (var j = 0; j < botCands.length; j++) if (Q[i].f(botCands[j])) yes++;
      if (yes === 0 || yes === botCands.length) continue;
      var sc = Math.abs(yes - botCands.length / 2) + Math.random() * 1.5;
      if (sc < bestScore) { bestScore = sc; best = i; }
    }
    if (best < 0) {
      /* nothing splits the pile: bot takes a coin flip guess */
      var g = botCands[A.randInt(botCands.length)];
      if (g === you) { logBot = 'BOT: Is it ' + g.name + '?  ...yep.'; end(false, 'Lucky bot. Still counts.'); }
      else { logBot = 'BOT: Is it ' + g.name + '?  NOPE'; end(true, 'The bot panicked and guessed wrong.'); }
      return;
    }
    askedBot[best] = true;
    var ans = Q[best].f(you), keep = [];
    for (var k = 0; k < botCands.length; k++) if (Q[best].f(botCands[k]) === ans) keep.push(botCands[k]);
    botCands = keep;
    logBot = 'BOT: ' + Q[best].q + '  you: ' + (ans ? 'YES' : 'NO');
    state = 'you';
  }

  function end(win, why) {
    state = 'over'; result = why;
    if (win) A.save('who_wins', A.load('who_wins', 0) + 1);
    scene.won = win;
  }

  function cardRect(i) {
    var c = i % 6, r = Math.floor(i / 6);
    return { x: GX + c * (CW + GAP), y: GY + r * (CH + GAP), w: CW, h: CH };
  }
  function qRect(i) {
    var c = i % 2, r = Math.floor(i / 2);
    return { x: 612 + c * 168, y: 196 + r * 38, w: 160, h: 32 };
  }

  /* ---- face painter ---- */
  function face(f, cx, cy, s) {
    var ctx = A.ctx, hc = HAIR[f.hair] || '#5a3b22';
    /* shoulders */
    ctx.fillStyle = f.shirt;
    ctx.beginPath(); ctx.arc(cx, cy + 48 * s, 30 * s, Math.PI, 0, false); ctx.closePath(); ctx.fill();
    ctx.fillStyle = f.skin; ctx.fillRect(cx - 6 * s, cy + 14 * s, 12 * s, 10 * s);
    /* long hair sits behind the head */
    if (f.style === 'long') A.rr(cx - 24 * s, cy - 22 * s, 48 * s, 52 * s, 16 * s, hc);
    /* ears + head */
    A.circle(cx - 20 * s, cy + 1 * s, 5 * s, f.skin);
    A.circle(cx + 20 * s, cy + 1 * s, 5 * s, f.skin);
    A.circle(cx, cy, 20 * s, f.skin);
    if (f.earrings) { A.circle(cx - 21 * s, cy + 8 * s, 2.6 * s, C.mustard); A.circle(cx + 21 * s, cy + 8 * s, 2.6 * s, C.mustard); }
    /* hair on top */
    if (f.style === 'short' || f.style === 'long') {
      ctx.fillStyle = hc;
      ctx.beginPath(); ctx.arc(cx, cy - 2 * s, 21 * s, Math.PI * 1.05, Math.PI * 1.95, false); ctx.closePath(); ctx.fill();
    } else if (f.style === 'curly') {
      for (var k = 0; k < 7; k++) {
        var a = Math.PI + k * Math.PI / 6;
        A.circle(cx + Math.cos(a) * 19 * s, cy - 3 * s + Math.sin(a) * 17 * s, 7 * s, hc);
      }
    } else {
      A.circle(cx - 7 * s, cy - 12 * s, 3 * s, 'rgba(255,255,255,0.35)');
    }
    /* beard */
    if (f.beard) {
      ctx.fillStyle = hc;
      ctx.beginPath(); ctx.arc(cx, cy + 2 * s, 19 * s, 0.1 * Math.PI, 0.9 * Math.PI, false); ctx.closePath(); ctx.fill();
    }
    /* eyes */
    A.circle(cx - 7 * s, cy - 2 * s, 2.3 * s, C.ink);
    A.circle(cx + 7 * s, cy - 2 * s, 2.3 * s, C.ink);
    if (f.glasses) {
      A.circle(cx - 7 * s, cy - 2 * s, 6 * s, null, C.ink, 1.8 * s);
      A.circle(cx + 7 * s, cy - 2 * s, 6 * s, null, C.ink, 1.8 * s);
      A.line(cx - 1 * s, cy - 2 * s, cx + 1 * s, cy - 2 * s, C.ink, 1.8 * s);
    }
    if (f.cheeks) { A.circle(cx - 12 * s, cy + 6 * s, 3.5 * s, 'rgba(232,96,76,0.55)'); A.circle(cx + 12 * s, cy + 6 * s, 3.5 * s, 'rgba(232,96,76,0.55)'); }
    /* mouth */
    ctx.strokeStyle = f.beard ? C.cream : C.ink; ctx.lineWidth = 2 * s;
    ctx.beginPath();
    if (f.smile) ctx.arc(cx, cy + 6 * s, 6 * s, 0.15 * Math.PI, 0.85 * Math.PI, false);
    else { ctx.moveTo(cx - 5 * s, cy + 10 * s); ctx.lineTo(cx + 5 * s, cy + 10 * s); }
    ctx.stroke();
    /* cap */
    if (f.hat) {
      ctx.fillStyle = C.coral;
      ctx.beginPath(); ctx.arc(cx, cy - 8 * s, 19 * s, Math.PI, 0, false); ctx.closePath(); ctx.fill();
      A.rr(cx - 4 * s, cy - 11 * s, 30 * s, 5 * s, 2 * s, '#b8432f');
    }
  }

  scene = {
    live: false,
    enter: function () { newGame(); },
    update: function (dt) {
      var anim = false;
      for (var i = 0; i < faces.length; i++) {
        if (faces[i].flip < 1) { faces[i].flip = Math.min(1, faces[i].flip + dt * 3); anim = true; }
      }
      if (state === 'bot') { botT += dt; anim = true; if (botT > 1.1) botMove(); }
      scene.live = anim;
    },
    draw: function (ctx) {
      A.bg();
      A.backBtn();
      A.text('WHO DIS?', 124, 31, 26, C.lilac);
      A.text(upCount() + (upCount() === 1 ? ' FACE LEFT' : ' FACES LEFT'), 580, 31, 18, C.cream, 'right');

      var i;
      for (i = 0; i < faces.length; i++) {
        var f = faces[i], r = cardRect(i);
        var sc = f.down ? Math.abs(1 - 2 * f.flip) : 1;
        var showBack = f.down && f.flip > 0.5;
        ctx.save();
        ctx.translate(r.x + r.w / 2, r.y + r.h / 2);
        ctx.scale(1, Math.max(0.02, sc));
        ctx.translate(-(r.x + r.w / 2), -(r.y + r.h / 2));
        if (showBack) {
          A.rr(r.x, r.y, r.w, r.h, 10, '#2a3a5f');
          A.text('?', r.x + r.w / 2, r.y + r.h / 2, 34, 'rgba(183,155,232,0.35)', 'center');
        } else {
          var hl = guessing && !f.down;
          A.rr(r.x, r.y, r.w, r.h, 10, hl ? '#fff4d6' : C.cream, hl ? C.mustard : null, 3);
          A.rr(r.x + 5, r.y + 5, r.w - 10, 72, 7, '#dfe7f2');
          ctx.save();
          A.path(r.x + 5, r.y + 5, r.w - 10, 72, 7); ctx.clip();
          face(f, r.x + r.w / 2, r.y + 38, 1);
          ctx.restore();
          A.text(f.name, r.x + r.w / 2, r.y + 91, 13, C.ink, 'center');
        }
        ctx.restore();
      }

      /* panel */
      A.rr(612, 64, 90, 110, 12, C.cream);
      ctx.save(); A.path(617, 69, 80, 76, 8); ctx.clip();
      ctx.fillStyle = '#dfe7f2'; ctx.fillRect(617, 69, 80, 76);
      face(you, 657, 104, 1);
      ctx.restore();
      A.text(you.name, 657, 160, 13, C.ink, 'center');
      A.text('YOU ARE', 716, 80, 13, C.dim);
      A.text(you.name, 716, 102, 22, C.lilac);
      A.text('BOT HAS ' + botCands.length + ' LEFT', 716, 128, 15, C.cream);
      A.text(state === 'bot' ? 'bot is thinking...' : (state === 'you' ? (guessing ? 'tap the face you think it is' : 'your turn') : ''), 716, 150, 13, C.mustard, 'left', 'normal');
      A.text(logYou, 612, 180, 12, C.cream, 'left', 'normal');

      for (i = 0; i < Q.length; i++) {
        var qr = qRect(i), off = askedYou[i] || state !== 'you' || guessing;
        A.rr(qr.x, qr.y, qr.w, qr.h, 8, off ? '#26334f' : C.lilac);
        A.text(Q[i].q, qr.x + qr.w / 2, qr.y + qr.h / 2 + 1, 13, off ? 'rgba(244,236,216,0.3)' : C.ink, 'center');
      }
      A.text(logBot, 612, 466, 12, C.sky, 'left', 'normal');
      A.btn(GUESS, guessing ? 'CANCEL GUESS' : 'MAKE A GUESS', guessing ? C.cream : C.mustard, C.ink, 18, state !== 'you');

      if (state === 'over') {
        A.overlay(scene.won ? 'YOU GOT IT' : 'BOT WINS', result + '\nIt was ' + bot.name + '.', C.lilac);
        A.btn(A.OV_A, 'PLAY AGAIN', C.lilac, C.ink, 20);
        A.btn(A.OV_B, 'MENU', C.bg2, C.cream, 20);
      }
    },
    up: function (x, y) {
      var i;
      if (state === 'over') {
        if (A.hit(A.OV_A, x, y)) newGame();
        else if (A.hit(A.OV_B, x, y)) A.go('menu');
        return;
      }
      if (A.hit(A.BACK, x, y)) { A.go('menu'); return; }
      if (state !== 'you') return;
      if (A.hit(GUESS, x, y)) { guessing = !guessing; return; }
      if (guessing) {
        for (i = 0; i < faces.length; i++) {
          if (!faces[i].down && A.hit(cardRect(i), x, y)) {
            guessing = false;
            if (faces[i] === bot) { logYou = 'YOU: Is it ' + bot.name + '?  YES'; end(true, 'Called it.'); }
            else { logYou = 'YOU: Is it ' + faces[i].name + '?  NOPE'; end(false, 'Wrong face, game over.'); }
            return;
          }
        }
        return;
      }
      for (i = 0; i < Q.length; i++) {
        if (!askedYou[i] && A.hit(qRect(i), x, y)) { ask(i); return; }
      }
      /* manual flip for people who like doing it the old way */
      for (i = 0; i < faces.length; i++) {
        if (A.hit(cardRect(i), x, y)) { faces[i].down = !faces[i].down; faces[i].flip = faces[i].down ? 0 : 1; return; }
      }
    }
  };
  A.register('whodis', scene);
})();

</script>
<script>
/* start once the page is ready */
window.onload = function () { ARK.start(); };

</script>
